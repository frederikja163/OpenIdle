# Path-based pull request labels, applied by .github/workflows/label-prs.yml
# (actions/labeler). Patterns are minimatch globs matched against each changed
# file's full path from the repository root, so `Backend/**` does not match
# Generators/Backend/. A PR gets every label with at least one matching file;
# the workflow's sync-labels removes a label from this file again once no
# changed file matches. Keep .github/CODEOWNERS in step with this file.

backend:
  - changed-files:
      - any-glob-to-any-file:
          - Backend/**
          - types.xml
  # The .NET test project also holds the generator's tests; those belong to
  # `generator` below, so only count test files outside that folder. Every
  # glob in an all-globs-to-any-file list must match the same file, which is
  # what turns the negated pattern into an exclusion.
  - changed-files:
      - all-globs-to-any-file:
          - tests/**
          - "!tests/OpenIdle.Tests/Generators/**"

frontend:
  - changed-files:
      - any-glob-to-any-file:
          - Frontend/**

generator:
  - changed-files:
      - any-glob-to-any-file:
          - Generators/**
          - tests/OpenIdle.Tests/Generators/**

# Docker, deployment and CI. Quoted because YAML reads a leading `*` as an alias.
devops:
  - changed-files:
      - any-glob-to-any-file:
          - "**/Dockerfile*"
          - "**/.dockerignore"
          - "**/*compose*.y*ml"
          - deploy/**
          - .github/**
