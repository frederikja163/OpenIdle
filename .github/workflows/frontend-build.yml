name: Frontend Build

# Mirrors backend-build.yml: pull requests run it directly, and
# publish-images.yml calls it before pushing the frontend image.
on:
  pull_request:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Keep in step with "packageManager" in Frontend/package.json and the
          # base image in Frontend/Dockerfile.
          bun-version: 1.3.10

      - name: Install
        run: bun install --frozen-lockfile

      # Both suites need a browser: vitest's `client` project runs Svelte
      # component tests in real chromium, and Playwright drives the e2e run.
      # --with-deps adds the system libraries the runner image lacks, which the
      # local `test:e2e:setup` script does not need.
      - name: Install Playwright chromium
        run: bunx playwright install --with-deps chromium

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run check

      - name: Run unit tests
        run: bun run test:unit -- --run

      - name: Run e2e tests
        run: bun run test:e2e

      - name: Upload Playwright output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: Frontend/test-results
          retention-days: 7
