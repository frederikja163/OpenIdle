name: Backend Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore OpenIdle.slnx

      - name: Build
        run: dotnet build OpenIdle.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test tests/OpenIdle.Tests/OpenIdle.Tests.csproj --configuration Release --no-build

      - name: Run integration tests
        run: dotnet test tests/OpenIdle.IntegrationTests/OpenIdle.IntegrationTests.csproj --configuration Release --no-build

      # types.xml is the source of truth for the frontend protocol too, and the
      # generated TypeScript is committed. Regenerating here catches a contract
      # change that was not accompanied by `bun run gen:dto`.
      - name: Check the generated TypeScript DTOs are up to date
        run: |
          dotnet run --project Generators/Generator -- -i types.xml -t Ts -o Frontend/src/lib/ws/dto.generated.ts
          git diff --exit-code -- Frontend/src/lib/ws/dto.generated.ts
