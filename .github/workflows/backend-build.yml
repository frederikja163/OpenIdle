name: Backend Build

# Pull requests run this directly. Pushes to main and release reach it through
# publish-images.yml, which calls it before it pushes anything to GHCR — so an
# image is never published from a commit whose tests did not pass. Keeping the
# push trigger off avoids running the whole suite twice for one commit.
on:
  pull_request:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore OpenIdle.slnx

      - name: Build
        run: dotnet build OpenIdle.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test tests/OpenIdle.Tests/OpenIdle.Tests.csproj --configuration Release --no-build

      - name: Run integration tests
        run: dotnet test tests/OpenIdle.IntegrationTests/OpenIdle.IntegrationTests.csproj --configuration Release --no-build

      # types.xml is the source of truth for the frontend protocol too. The
      # generated TypeScript is not committed (frontend-build.yml regenerates it
      # via `bun run check`), so this only proves both emitters still run on the
      # current contract — a parse error here fails the backend build too.
      - name: Check both TypeScript emitters run
        run: |
          dotnet run --project Generators/Generator -- -i types.xml -t Ts -o /tmp/dto.generated.ts
          dotnet run --project Generators/Generator -- -i types.xml -t TsSchema -o /tmp/protocol.generated.ts
